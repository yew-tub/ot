name: YewTuBot
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   NOSTR_PRIVATE_KEY   – Nostr nsec private key (nsec1... or hex)
#   SESSION_COOKIES     – Pre-authenticated session cookies from get-session.js
#
# Optional:
#   INVIDIOUS_INSTANCES – comma-separated list of Invidious instances (defaults to a curated set)

on:
  schedule:
    - cron: '*/7 * * * *'
  
  workflow_dispatch:
    inputs:
      rescan:
        description: 'Clear processed/commented state and rescan all posts'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Restore bot state
      uses: actions/cache/restore@v5
      with:
        path: .bot-state.json
        key: bot-state-${{ github.run_id }}
        restore-keys: |
          bot-state-
          
    - name: Run bot
      env:
        NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
        SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}
        NODE_ENV: production
        DEBUG: 'true'
        # Live-only for scheduled runs: walking back into old posts means paying
        # high commentCost for a ~5% zap rate. Rescans still use backfill depth.
        BACKFILL: ${{ inputs.rescan == 'true' && 'true' || 'false' }}
        BACKFILL_DEPTH: ${{ inputs.rescan == 'true' && '50' || '2' }}
        LIVE_DEPTH: '2'
        MAX_COMMENT_COST: '5'
        MIN_POST_AGE_MIN: '30'
        MAX_POST_AGE_MIN: '360'
        # Causal track records for authors/subs. A "dead" verdict decays and
        # returns to probation automatically, so nothing stays blocked forever.
        TARGET_STATS_ENABLED: 'true'
        TARGET_MIN_COMMENTS: '8'
        TARGET_MIN_NET_PER: '0'
        TARGET_STATS_HALF_LIFE_DAYS: '30'
        TARGET_STATS_MAX_AGE_DAYS: '180'
        TARGET_SETTLE_HOURS: '48'
        # Private gist: human-readable archive of dead/profitable targets plus a
        # backup to restore from if the Actions cache is ever lost.
        GIST_ENABLED: 'true'
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        # Thumbnail in the Nostr note, embedded directly from the YouTube CDN.
        #
        # Blossom upload is off: every public Blossom server tested
        # (blossom.primal.net, blossom.band, blossom.nostr.build,
        # cdn.blossom.cloud, blossom.yabu.me) rejects programmatic uploads, so
        # the attempt only cost round-trips before falling back anyway. The
        # thumbnail bytes are still fetched and validated, so a dead video id
        # yields no image rather than a broken one.
        # Set BLOSSOM_ENABLED=true and point BLOSSOM_SERVERS at a server you
        # run to get content-addressed URLs.
        NOSTR_INCLUDE_THUMBNAIL: 'true'
        THUMBNAIL_QUALITY: 'hqdefault'
        BLOSSOM_ENABLED: 'false'
        # Fund proven winners before unknowns instead of taking feed order.
        PRIORITIZE_TARGETS: 'true'
        # Stand down when realised rolling ROI drops below the floor.
        CIRCUIT_BREAKER_ENABLED: 'true'
        CIRCUIT_ROI_WINDOW_DAYS: '30'
        CIRCUIT_MIN_SAMPLES: '40'
        CIRCUIT_MIN_ROI: '-0.25'
        RESCAN: ${{ inputs.rescan || 'false' }}
      run: npm start
        
    - name: Save bot state
      uses: actions/cache/save@v5
      if: always()
      with:
        path: .bot-state.json
        key: bot-state-${{ github.run_id }}
